<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reasons to Live</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Reasons to Live</h1>
        <p>A collective reminder of why we stay. Add yours below.</p>
        <div id="totalCounter">Total Reasons: <span id="countNumber">0</span></div>
    </header>

    <main>
        <section class="input-section">
            <textarea id="reasonInput" placeholder="What is a reason to stay today?"></textarea>
            <button id="submitBtn">Post Note</button>
        </section>

        <section class="board" id="stickyBoard">
            </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
